<!-- make button invisible, but clickable -->

<!DOCTYPE html>
<html>
	<head>
		<title>POINT AND CLICK</title>
	</head>
	<body>
		<img id="img" style="width:90%;position:fixed;top:0;left:0;"src="test.png" onclick="testfunc()">
		<button id="button" style="cursor:zoom-in;position:fixed;top:10%;left:10%;width:5%;height:10%;background:red;border:none;font-size:0;" onclick="makeNotExist('img')"></button>
<!-- JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT   -->
		<script>
			makeInvisible("button");
			function makeNotExist(elementId) {
				document.getElementById(elementId).style.display = "none";
			};
			function makeExist(elementId) {
				document.getElementById(elementId).style.display = "initial";
			};
		</script>
<!-- JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT  JAVASCRIPT   -->
	</body>
</html>
